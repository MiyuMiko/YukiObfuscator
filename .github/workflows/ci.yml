name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build and test
        shell: pwsh
        run: ./test.ps1

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: yuki-obfuscator
          path: build/yuki-obfuscator.jar
          if-no-files-found: error
